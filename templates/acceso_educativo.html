<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta educativa | Portal de Postulaciones</title><link rel="stylesheet" href="/static/acceso.css"></head>
<body><main class="fondo"><section class="tarjeta"><a class="volver" href="/">← Volver al portal</a><img src="/static/logo-banco-guayaquil.png" alt="Banco Guayaquil" class="logo"><p class="etiqueta">ACCESO EDUCATIVO</p><h1 id="titulo">Inicia sesión</h1><p class="subtitulo" id="subtitulo">Usa tu cuenta creada para este proyecto.</p><form id="form-acceso"><label>Correo electrónico<input type="email" name="email" required autocomplete="email" placeholder="nombre@ejemplo.com"></label><label>Contraseña<input type="password" name="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo 8 caracteres"></label><button type="submit">Ingresar</button></form><form id="form-registro" hidden><label>Nombre completo<input type="text" name="nombre" required minlength="2" maxlength="150" autocomplete="name"></label><label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label><label>Contraseña<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label><button type="submit">Crear cuenta educativa</button></form><p id="mensaje" role="status"></p><p class="cambio"><span id="texto-cambio">¿Aún no tienes una cuenta?</span> <button id="cambiar" type="button">Crear cuenta</button></p><p class="aviso">Las cuentas creadas aquí son exclusivas de este portal educativo. Las contraseñas se almacenan con hash de seguridad.</p></section></main><script src="/static/acceso.js"></script></body></html>
